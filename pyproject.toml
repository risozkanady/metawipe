[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "metawipe"
version = "0.3.1b1"
description = "CLI that strips metadata from images, HEIC, videos, PDFs and Office/OpenDocument files"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["pypdf[crypto]>=5.0"]

[project.optional-dependencies]
tui = ["textual>=0.80"]

[project.scripts]
metawipe = "metawipe.cli:main"

[tool.setuptools]
packages = ["metawipe"]
