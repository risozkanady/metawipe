# Tests on Linux, Windows and macOS, then builds single-file executables (PyInstaller).
# Push a tag vX.Y.Z (matching metawipe.__version__) to publish them as a GitHub release with a Homebrew formula;
# A push to testing (or "Run workflow") only builds them (downloadable from the run page).
name: release

on:
  push:
    tags: ["v*"]
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ".[tui]" python-docx
      - run: python -W ignore -m unittest discover -s tests -t . -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64, exe: metawipe }
          - { os: windows-latest, target: windows-x86_64, exe: metawipe.exe }
          - { os: macos-latest, target: macos-arm64, exe: metawipe }
          - { os: macos-15-intel, target: macos-x86_64, exe: metawipe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ".[tui]" pyinstaller
      - id: version
        run: echo "version=$(python -c 'import metawipe; print(metawipe.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Tag matches metawipe.__version__
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v${{ steps.version.outputs.version }}"
      - name: Build
        run: |
          if [ "${{ runner.os }}" = Linux ]; then
            # bundle Debian 12 libraries (glibc 2.36): built on the runner's own Ubuntu the TUI needs its brand-new glibc
            docker run --rm -v "$PWD:/src" -w /src python:3.13-bookworm \
              bash -c 'pip install -q ".[tui]" pyinstaller && packaging/build.sh; rc=$?; chown -R "$(stat -c %u:%g .)" .; exit $rc'
          else
            packaging/build.sh
          fi
      - name: TUI starts on an older Linux (Ubuntu 24.04)
        if: runner.os == 'Linux'
        run: |
          rc=0
          docker run --rm -e TERM=xterm-256color -v "$PWD/dist:/d" ubuntu:24.04 script -qec "timeout 5 /d/metawipe --tui /d" /dev/null || rc=$?
          test "$rc" -eq 124  # 124: still running when timeout stopped it; a failed start exits at once
      - name: Smoke test (outside the source tree, so only the executable is used)
        run: |
          exe="$PWD/dist/${{ matrix.exe }}"
          cd "$RUNNER_TEMP"
          "$exe" --version
          python -c "import zlib,struct; c=lambda t,d: struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)); open('s.png','wb').write(b'\x89PNG\r\n\x1a\n'+c(b'IHDR',struct.pack('>IIBBBBB',1,1,8,0,0,0,0))+c(b'tEXt',b'Author\x00SECRETNAME')+c(b'IDAT',zlib.compress(b'\x00\x00'))+c(b'IEND',b''))"
          "$exe" --full s.png
          if grep -a -q SECRETNAME s.clean.png; then echo "metadata survived"; exit 1; fi
      - name: Package
        run: |
          name="metawipe-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          cp README.md LICENSE dist/
          cd dist
          if [ "${{ runner.os }}" = Windows ]; then 7z a "../$name.zip" metawipe.exe README.md LICENSE; else tar czf "../$name.tar.gz" metawipe README.md LICENSE; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: metawipe-*.*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums and Homebrew formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd out && sha256sum metawipe-* > SHA256SUMS)
          packaging/formula.sh "$version" out/SHA256SUMS > out/metawipe.rb
          cat out/SHA256SUMS out/metawipe.rb
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "${GITHUB_REF_NAME#v}" in *[0-9][a-z]*|*-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/* --title "metawipe ${GITHUB_REF_NAME#v}" --generate-notes $pre
      - name: Update the Homebrew tap (needs secret HOMEBREW_TAP_TOKEN with write access to homebrew-metawipe)
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.TOKEN != ''
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-metawipe.git" tap
          mkdir -p tap/Formula && cp out/metawipe.rb tap/Formula/metawipe.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/metawipe.rb
          git diff --cached --quiet || { git commit -m "metawipe ${GITHUB_REF_NAME#v}" && git push; }
